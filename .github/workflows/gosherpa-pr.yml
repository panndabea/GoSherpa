name: GoSherpa PR Intelligence

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base-ref:
        description: Base ref or SHA for manual runs
        required: false
        default: HEAD

permissions:
  contents: read

jobs:
  gosherpa:
    name: Analyze pull request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoSherpa
        uses: ./
        with:
          version: local
          base-ref: ${{ github.event.pull_request.base.sha || inputs['base-ref'] }}
